name: Fix and Deploy (Reusable)

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fix-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Normalize filenames
        run: |
          dirty=false

          match=$(find . -maxdepth 1 -regextype posix-extended -regex './index \([0-9]+\)\.html' -print -quit)
          if [[ -n "$match" ]]; then
            mv "$match" ./index.html
            dirty=true
          fi

          match=$(find . -maxdepth 1 -regextype posix-extended -regex './style_css \([0-9]+\)\.txt' -print -quit)
          if [[ -n "$match" ]]; then
            mv "$match" ./style_css.txt
            dirty=true
          fi

          if [[ "$dirty" == "true" ]]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "fix: normalize filenames"
            git push
          fi

      - name: Create README.md if missing
        run: |
          if [[ -f README.md ]]; then
            echo "README.md already exists, skipping"
            exit 0
          fi

          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          if [[ "$REPO" == "$OWNER.github.io" ]]; then
            PAGE_URL="https://$OWNER.github.io/"
          else
            PAGE_URL="https://$OWNER.github.io/$REPO/"
          fi

          cat > README.md <<EOF
          # $REPO

          Live site: [$PAGE_URL]($PAGE_URL)
          EOF

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "docs: add README with GitHub Pages link"
          git push

      - name: Rename CSS for deployment
        run: |
          for f in *_css.txt; do
            [ -e "$f" ] || continue
            mv "$f" "${f%_css.txt}.css"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
